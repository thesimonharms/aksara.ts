# Hands-off TrOCR v3 (freeze→unfreeze→score) on NAS Intel XPU.
services:
  trocr-train:
    build: .
    image: aksara-trocr-xpu:latest
    container_name: aksara-trocr-v3
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-105}"
    ipc: host
    shm_size: "16gb"
    env_file:
      - .env
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_USERNAME: ${HF_USERNAME:-thesimonharms}
      BASE_MODEL: ${BASE_MODEL:-thesimonharms/trocr-javanese-synthetic}
      HUB_MODEL_ID: ${HUB_MODEL_ID:-thesimonharms/trocr-javanese-synthetic-v3}
      DATASET_NAME: ${DATASET_NAME:-thesimonharms/javanese-dataset-180k}
      EXTRA_DATASETS: ${EXTRA_DATASETS:-thesimonharms/javanese-dataset,thesimonharms/javanese-nusaaksara-ocr}
      EXTRA_UPSAMPLE: ${EXTRA_UPSAMPLE:-2,8}
      STAGE_A_EPOCHS: ${STAGE_A_EPOCHS:-30}
      STAGE_B_EPOCHS: ${STAGE_B_EPOCHS:-14}
      STAGE_A_LR: ${STAGE_A_LR:-5e-6}
      STAGE_B_LR: ${STAGE_B_LR:-2e-6}
      TROCR_BATCH_SIZE: ${TROCR_BATCH_SIZE:-36}
      N_SCORE: ${N_SCORE:-1500}
    volumes:
      - /volume1/docker/aksara-trocr/trocr:/workspace/trocr:ro
      - /volume1/docker/aksara-trocr/output:/workspace/output
      - /volume1/docker/aksara-trocr/hf-cache:/workspace/hf-cache
      - /volume1/docker/aksara-trocr/logs:/workspace/logs
    restart: on-failure
    command: ["train-v3"]
